<section class="panel" id="overview" role="tabpanel">
<h2>1. Overview</h2>
<p>The Trading Task module of HSB Loyalty: clients trade on real accounts, every closed lot is converted into coins at the configured rate; coins go to the wallet and are used to redeem rewards. This page is the shared spec between product, backend and front-end and reflects the current code behaviour (accepted on UAT). Updated: 2026-10-19.</p>

<h3>How to read this page</h3>
<ul>
  <li>Rows / blocks with a <span class="rvnew">purple background</span> = requests of the open round (2026-10-19), not yet implemented by backend. Details in the <a href="#req" class="ref">Open requests</a> tab.</li>
  <li>All later changes are written directly into this page and into the <a href="#log" class="ref">Change log</a> tab; no separate files are sent.</li>
  <li>Times in the DB and in responses are UTC; days are split by the program time zone (<code>tz_minutes</code>).</li>
</ul>

<h3>Components</h3>
<table>
  <tr><th style="width:26%">Components</th><th>Role</th></tr>
  <tr><td>Engine 1 — coin calculation</td><td>Reads closed deals from MT5, converts them into coins, writes a per-deal detail and a daily summary. See the <a href="#engine" class="ref">Engine</a> tab.</td></tr>
  <tr><td>Engine 2 — coin release</td><td>Applies the daily cap and puts coins into the wallet (coin lot + coin ledger).</td></tr>
  <tr><td>App APIs</td><td>7 APIs for the app (table below).</td></tr>
</table>

<h3>API list</h3>
<p>Path prefix: <code>/pointSys/app/point/</code>. All APIs use <code>POST</code>, JSON body, envelope <code>{ success, code, message, result }</code>; on error: <code>success = false</code>, error code in <code>message</code>. All APIs check the <code>x-auth-key</code> header.</p>

<h2>2. Open requests — 2026-10-19</h2>
<p>Two items. When done and deployed to UAT, share the G-1 path; QA runs a small test on both and updates this page.</p>

<h3>G-1. New API <code>guest/tradingTask/get</code> <span class="pending">OPEN</span></h3>
<p>Guests (no <code>clientId</code>, no token) can still see the program rules on the Earn page. Product accepts: every guest is shown the configuration of client group <code>direct_client</code>.</p>
<ul>
  <li>Suggested path <code>/pointSys/app/point/guest/tradingTask/get</code> (backend may rename; please tell us).</li>
  <li>No token check, no <code>clientId</code> needed; if sent, it is ignored. Keep checking <code>x-auth-key</code>; open anonymous access in <code>t_uri_access_rule</code>. Supports <code>currentTime</code> like the other APIs.</li>
  <li>In code, call the method <code>PointTaskTradingMapper.getAppTradingTaskConfig</code> again (as in <code>AppPointTradeTaskServiceImpl</code> line 124). These are <b>method arguments</b>, not request parameters: this API has no request parameters except <code>currentTime</code> for testing. The logged-in version reads these values from <code>crm_customer_base</code> by <code>clientId</code>; a guest has no <code>clientId</code>, so skip that read and pass fixed values: <div class="scroll"><table>
      <tr><th style="width:22%">Method argument</th><th>Logged-in version (current)</th><th style="width:30%">Guest version</th></tr>
      <tr><td><code>groupCode</code></td><td><code>crm_customer_base.group_code</code></td><td><code>direct_client</code>, hard-coded</td></tr>
      <tr><td><code>promoTable</code></td><td><code>PromoTableEnum.POINT_PROGRAM.getTableName()</code></td><td>Unchanged</td></tr>
      <tr><td><code>bookType</code></td><td><code>crm_customer_base.client_book_type</code>; if empty, <code>UNKNOWN_BOOK_TYPE</code> (9)</td><td><code>UNKNOWN_BOOK_TYPE</code> (9)</td></tr>
      <tr><td><code>kycTime</code></td><td><code>crm_customer_base.kyc_approve_time</code></td><td><code>0</code></td></tr>
      <tr><td><code>ftdTime</code></td><td><code>crm_customer_base.first_deposit_time</code></td><td><code>0</code></td></tr>
      <tr><td><code>firstTradeTime</code></td><td><code>crm_customer_base.first_real_trade_time</code></td><td><code>0</code></td></tr>
      <tr><td><code>clientId</code></td><td>From the request: <code>clientId</code></td><td><code>null</code></td></tr>
      <tr><td><code>now</code></td><td>System time, or <code>currentTime</code> if sent in the request</td><td>Unchanged</td></tr>
    </table></div> With <code>clientId = null</code>, the existing SQL already gives the required behaviour: programs hidden from everyone are not shown and the blacklist does not apply. No SQL change needed. Equivalent SQL is in the API spec.</li>
  <li>Response has the same structure as <code>tradingTask/get</code>: <code>program</code> built by the existing <code>buildProgram</code>; <code>today</code> = result of <code>buildToday(null, …)</code> (<code>not_started</code>, all numbers 0); <code>accounts = []</code>; no <code>selectedAccountId</code>, no <code>tiers</code>.</li>
  <li>Only this API. The other five APIs are personal data; guests do not need them.</li>
</ul>
<p><button type="button" class="specbtn" data-spec="api-guest">Spec guest/tradingTask/get</button></p>

<h3>G-2. Add 3 fields to the existing API <code>tradingTask/get</code> <span class="pending">OPEN</span></h3>
<p><code>tradingTask/get</code> is a <b>live</b> API. This request <b>only adds 3 fields</b> for the account tier feature on the Earn page (logged-in clients). Tier names and deposit thresholds are kept by the front-end; backend only returns the data below.</p>

<h4>Unchanged</h4>
<ul>
  <li>Path, request, authentication: unchanged.</li>
  <li><b>All existing fields stay as they are</b> (name, type, meaning): <code>tradingTask</code>, all of <code>program</code>, all of <code>today</code>, <code>selectedAccountId</code>, <code>accounts[].id</code>, <code>accounts[].eligible</code>, <code>accounts[].rates</code>. No field is removed or renamed.</li>
  <li>Existing logic unchanged: program selection, <code>today</code> calculation, the list and order of <code>accounts</code>, how <code>rates</code> are filtered and sorted.</li>
</ul>

<h4>New</h4>
<div class="scroll"><table>
  <tr><th style="width:22%">New field</th><th style="width:16%">Location</th><th style="width:12%">Type</th><th>How to get it</th></tr>
  <tr><td><code>group</code></td><td>In each element of <code>accounts[]</code></td><td>string</td>
      <td>The MT5 group that <code>buildAccounts</code> already reads from <code>mt5_users</code> to compute <code>rates</code> (no extra query). Return the <b>full name as is</b>, e.g. <code>Direct\VIP1</code>, <code>1F\Direct\Mini10</code>; do not truncate. Present on every account, including <code>eligible = false</code>. Group not found → <code>null</code>.</td></tr>
  <tr><td><code>lifetimeDeposit</code></td><td>In each element of <code>accounts[]</code></td><td>decimal, USD</td>
      <td>Total approved deposits of the account. Run the SQL below once per client, then map by <code>login_id</code>. Account with no rows → <code>0</code>.</td></tr>
  <tr><td><code>tiers</code></td><td>Top level of <code>result</code>, alongside <code>accounts</code></td><td>array of <code>{ group, rates }</code></td>
      <td>Take the rate rows of the current task in <code>point_task_trading_point_conversion</code> (<code>deleted = 0</code>), grouped by <code>mt5_group</code>; one element per group. <code>group</code> = <code>mt5_group</code> full name; <code>rates</code> produced by <b>the same method</b> <code>buildRates</code> as <code>accounts[].rates</code>, so both always match. Skip groups whose <code>rates</code> is empty. No sorting needed. Not returned when <code>tradingTask = false</code>.</td></tr>
</table></div>
<p class="specmeta">SQL for <code>lifetimeDeposit</code>:</p>
<pre>SELECT login_id, SUM(amount_converted) AS deposit_usd   -- amount_converted is always USD
FROM bo_client_deposit_proposal
WHERE proposal_status = 2                                      -- approved
  AND client_id = #{clientId}
GROUP BY login_id</pre>
<p class="specmeta">Response after the change (relevant part only):</p>
<pre>{
  "tradingTask": true,
  "program": { ...unchanged... },
  "today":   { ...unchanged... },
  "selectedAccountId": 31000001,
  "accounts": [
    { "id": 31000001, "eligible": true, "rates": [ ...unchanged... ],
      "group": "Direct\\Mini400",          // NEW
      "lifetimeDeposit": 150.0 },            // NEW
    { "id": 31000002, "eligible": false, "rates": [],
      "group": "1F\\Direct\\Mini10",       // NEW
      "lifetimeDeposit": 0 }                 // NEW
  ],
  "tiers": [                                 // NEW
    { "group": "Direct\\Mini400", "rates": [ { "type": "symbol_group", "value": "metal", "ptsPerLot": 70 }, "..." ] },
    { "group": "Direct\\Mini10",  "rates": [ "..." ] },
    { "group": "Direct\\VIP1",    "rates": [ "..." ] },
    { "group": "Direct\\MIVIP",   "rates": [ "..." ] }
  ]
}</pre>

<h3>General notes</h3>

tes</code></td><td>int</td><td>Program time zone, used to split days.</td></tr><tr><td><code>program.termsUrl</code></td><td>string | null</td><td>Terms PDF link, returned as is. <code>null</code> or empty string = none.</td></tr><tr><td><code>program.rateRange</code></td><td>{min, max} | null</td><td>Lowest and highest coins-per-lot rate across all rate rows of the program.</td></tr><tr><td><code>today.periodKey</code></td><td>yyyy-MM-dd</td><td>Today in the program time zone.</td></tr><tr><td><code>today.lots</code></td><td>decimal</td><td>Total lots of deals counted today.</td></tr><tr><td><code>today.lotsValid</code></td><td>decimal</td><td>Lots of deals whose coins are already in the wallet.</td></tr><tr><td><code>today.points</code></td><td>long</td><td>Coins credited to the wallet today.</td></tr><tr><td><code>today.capped</code></td><td>bool</td><td>Daily cap reached.</td></tr><tr><td><code>today.status</code></td><td>string</td><td><code>not_started</code> / <code>pending</code> / <code>earning</code> / <code>credited</code> (see rules).</td></tr><tr><td><code>today.creditAt</code></td><td>ISO UTC | null</td><td>Expected credit time, only when <code>pending</code>.</td></tr><tr><td><code>today.updatedAt</code></td><td>ISO UTC | null</td><td>Last update.</td></tr><tr><td><code>selectedAccountId</code></td><td>long</td><td>Preselected account = first element of <code>accounts</code>. Absent when <code>accounts</code> is empty.</td></tr><tr><td><code>accounts[].id</code></td><td>long</td><td>Real trading account number.</td></tr><tr><td><code>accounts[].eligible</code></td><td>bool</td><td>The account's MT5 group has rate rows in the program.</td></tr><tr><td><code>accounts[].rates[]</code></td><td>{type, value, ptsPerLot}</td><td>Rate table of the account. <code>type</code> = <code>symbol</code> / <code>symbol_group</code> / <code>any</code>.</td></tr><tr class="rvnew"><td><code>accounts[].group</code> <span class="pending">NEW</span></td><td>string</td><td>T SET @now = UTC_TIMESTAMP();

SELECT d.*,                                   -- program fields are built from this row
       r.min_ppl AS rate_range_min,
       r.max_ppl AS rate_range_max
FROM promo_client_group a
JOIN point_program b      ON b.id = a.promo_config_id
JOIN point_task_bundle c  ON c.program_id = b.id
JOIN point_task_trading d ON d.task_bundle_id = c.id
LEFT JOIN (
    SELECT task_id, MIN(point_per_lot) AS min_ppl, MAX(point_per_lot) AS max_ppl
    FROM point_task_trading_point_conversion
    WHERE deleted = 0 AND point_per_lot &gt; 0
    GROUP BY task_id
) r ON r.task_id = d.id
WHERE a.client_group = 'direct_client'        -- hard-coded client group
  AND a.promo_table  = 'point_program'
  AND a.enabled = 1 AND b.enabled = 1 AND c.enabled = 1 AND d.enabled = 1
  AND b.display_hide_book_type &lt;&gt; 9           -- guest book type = 9 (unknown)
  AND c.display_hide_book_type &lt;&gt; 9
  AND d.display_hide_book_type &lt;&gt; 9
  AND d.display_event = 'signup'              -- kyc / ftd / first trade time = 0
  AND (d.display_period_limit_apply = 0
       OR (@now &gt;= d.display_period_from AND @now &lt; d.display_period_to))
  AND d.display_hide_to_all = 0               -- clientId = null: no own trading log
                                              -- blacklist: not applied (clientId = null)
ORDER BY d.id
LIMIT 1;</pre></div></div><div class="specsrc" id="spec-api-history" data-title="tradingTask/getHistory" hidden><p class="specmeta">POST <code>/pointSys/app/point/tradingTask/getHistory</code> · Token</p><p>Daily trading coin history (History tab of the Earn page).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Logged-in client. Must match the token.</td></tr><tr><td><code>currentTime</code></td><td>long, seconds</td><td>For testing only: simulates the current time (epoch seconds). If not sent, server time is used. Invalid value → <code>INVALID_CURRENT_TIME</code>.</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>Start date. If not sent = today − 6 days.</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>End date. If not sent = today; later than today is cut to today.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>tradingTask</code></td><td>bool</td><td><code>false</code> = no program, or the client is blacklisted.</td></tr><tr><td><code>range</code></td><td>{from, to, tzMinutes}</td><td>Applied date range.</td></tr><tr><td><code>days[].date</code></td><td>yyyy-MM-dd</td><td>Date (program time zone). Only days with data, newest first.</td></tr><tr><td><code>days[].lots</code></td><td>decimal</td><td>= <code>lotsValid</code> of the day.</td></tr><tr><td><code>days[].points</code></td><td>long</td><td>Coins credited to the wallet.</td></tr><tr><td><code>days[].status</code></td><td>string</td><td>Same as <code>today.status</code>.</td></tr><tr><td><code>days[].capped</code></td><td>bool</td><td>The daily cap was reached that day.</td></tr></table></div></div><div class="specsec"><h4>3. Rules</h4><ul class="rules"><li>Range longer than 30 days → <code>RANGE_TOO_LONG</code>; <code>from</code> after <code>to</code> or wrong format → <code>INVALID_RANGE</code>.</li></ul></div></div><div class="specsrc" id="spec-api-summary" data-title="coin/summary" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/summary</code> · Token</p><p>Coin balance (top of the Coins page).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Logged-in client. Must match the token.</td></tr><tr><td><code>currentTime</code></td><td>long, seconds</td><td>For testing only: simulates the current time (epoch seconds). If not sent, server time is used. Invalid value → <code>INVALID_CURRENT_TIME</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>available</code></td><td>long</td><td>Total balance of valid lots.</td></tr><tr><td><code>expiring</code></td><td>long</td><td>Part of the balance expiring within the next 10 days.</td></tr><tr><td><code>pending</code></td><td>long</td><td>Trading coins waiting to be released. Not used by the front-end.</td></tr></table></div></div><div class="specsec"><h4>3. Rules</h4><ul class="rules"><li>Calculated over all of the client's coin lots from every source (trading, check-in, manual adjustment), independent of the program.</li></ul></div></div><div class="specsrc" id="spec-api-available" data-title="coin/listAvailable" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/listAvailable</code> · Token</p><p>Coin lots still valid (Available tab of the Coins page).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Logged-in client. Must match the token.</td></tr><tr><td><code>currentTime</code></td><td>long, seconds</td><td>For testing only: simulates the current time (epoch seconds). If not sent, server time is used. Invalid value → <code>INVALID_CURRENT_TIME</code>.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Page, default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Rows per page, default 15.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Display time zone (minutes offset from UTC), default 420 (GMT+7). The front-end sends <code>program.tzMinutes</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>items[].source</code></td><td>string</td><td><code>trading</code> / <code>daily_checkin</code> / <code>adjust</code>.</td></tr><tr><td><code>items[].earnedOn</code></td><td>yyyy-MM-dd</td><td>Date the coins were credited to the wallet.</td></tr><tr><td><code>items[].total</code></td><td>long</td><td>Initial coins of the lot.</td></tr><tr><td><code>items[].remaining</code></td><td>long</td><td>Remaining coins.</td></tr><tr><td><code>items[].status</code></td><td>string</td><td><code>active</code> (coins left) / <code>used</code> (fully used).</td></tr><tr><td><code>items[].creditAt</code></td><td>ISO UTC</td><td>Time the coins were credited to the wallet.</td></tr><tr><td><code>items[].expiresAt</code></td><td>ISO UTC</td><td>Expiry time.</td></tr><tr><td><code>items[].expiringSoon</code></td><td>bool</td><td>Has coins left and expires within the next 10 days.</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>Paging; <code>total</code> = total number of lots.</td></tr></table></div></div><div class="specsec"><h4>3. Rules</h4><ul class="rules"><li>Order: lots with coins left first, nearest expiry on top; fully used lots last.</li></ul></div></div><div class="specsrc" id="spec-api-expired" data-title="coin/listExpired" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/listExpired</code> · Token</p><p>Expired coin lots (Expired tab of the Coins page).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Logged-in client. Must match the token.</td></tr><tr><td><code>currentTime</code></td><td>long, seconds</td><td>For testing only: simulates the current time (epoch seconds). If not sent, server time is used. Invalid value → <code>INVALID_CURRENT_TIME</code>.</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>Start date. If not sent = today − 6 days.</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>End date. If not sent = today; later than today is cut to today.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Page, default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Rows per page, default 15.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Display time zone (minutes offset from UTC), default 420 (GMT+7). The front-end sends <code>program.tzMinutes</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>range</code></td><td>{from, to, tzMinutes}</td><td>Applied date range (filtered by expiry date).</td></tr><tr><td><code>items[].source</code></td><td>string</td><td>Same as <code>listAvailable</code>.</td></tr><tr><td><code>items[].earnedOn</code></td><td>yyyy-MM-dd</td><td>Date the coins were credited to the wallet.</td></tr><tr><td><code>items[].total</code></td><td>long</td><td>Initial coins.</td></tr><tr><td><code>items[].expired</code></td><td>long</td><td>Coins lost to expiry; 0 if fully used before expiry.</td></tr><tr><td><code>items[].expiredAt</code></td><td>ISO UTC</td><td>Expiry time.</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>Paging.</td></tr></table></div></div><div class="specsec"><h4>3. Rules</h4><ul class="rules"><li>Order: most recently expired first. Same date range limit as <code>getHistory</code>.</li></ul></div></div><div class="specsrc" id="spec-api-ledger" data-title="coin/ledger" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/ledger</code> · Token</p><p>Coin movement history (History tab of the Coins page).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Logged-in client. Must match the token.</td></tr><tr><td><code>currentTime</code></td><td>long, seconds</td><td>For testing only: simulates the current time (epoch seconds). If not sent, server time is used. Invalid value → <code>INVALID_CURRENT_TIME</code>.</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>Start date. If not sent = today − 6 days.</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>End date. If not sent = today; later than today is cut to today.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Page, default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Rows per page, default 15.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Display time zone (minutes offset from UTC), default 420 (GMT+7). The front-end sends <code>program.tzMinutes</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:16%">Type</th><th>Meaning</th></tr><tr><td><code>items[].happenedAt</code></td><td>ISO UTC</td><td>Time it happened.</td></tr><tr><td><code>items[].date</code></td><td>yyyy-MM-dd</td><td>Date it happened, by <code>tzMinutes</code>.</td></tr><tr><td><code>items[].type</code></td><td>string</td><td><code>earn</code> / <code>consume</code> / <code>refund</code> / <code>expire</code> / <code>adjust_positive</code> / <code>adjust_negative</code>.</td></tr><tr><td><code>items[].source</code></td><td>string</td><td><code>trading</code> / <code>daily_checkin</code> / <code>adjust</code> / <code>redeem</code>.</td></tr><tr><td><code>items[].points</code></td><td>long</td><td>Signed: credits positive, debits negative.</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>Paging.</td></tr></table></div></div><div class="specsec"><h4>3. Rules</h4><ul class="rules"><li><code>expire</code> rows are not in the coin ledger: they are generated from expired lots that still have a balance (<code>points</code> = − balance). Lots fully used before expiry produce no <code>expire</code> row.</li><li>Order: newest first. Each credit is one row, not merged.</li></ul></div></div>

<h2>4. Engine</h2>
<h3>Engine 1 — coin calculation (job <code>tradeLogSyncJob</code>)</h3>
<ol class="conds">
  <li>Reads new closed deals from MT5 by deal-id cursor (<code>t_cursor_notify_progress</code>, type <code>point_trade_point_log</code>; at most <code>fetch_num</code> deals per run). Only closing deals (<code>Entry = 1</code>), buy / sell (<code>Action</code> 0, 1), demo / admin MT5 groups excluded. When no program exists, the cursor still moves to the latest deal (old deals are not back-filled).</li>
  <li>From the account find the client (<code>bo_client_logins</code>, real accounts), from the client's <code>group_code</code> find the open tasks; blacklisted clients are skipped.</li>
  <li>Deals held shorter than <code>min_position_hold_second</code> are skipped.</li>
  <li>Find the rate by the account's MT5 group, priority: <code>symbol</code> (exact symbol) &gt; <code>symbol_group</code> &gt; <code>any</code> (value <code>other</code>). <code>symbol_group</code> is derived from the symbol path in <code>mt5_symbols</code>: <code>forex</code>, <code>metal</code>, <code>energy</code>, <code>index</code>, <code>stocks</code>, otherwise <code>other</code>.</li>
  <li>Deal coins = lots × rate, rounded down. Deal date = close time (converted to UTC by the MT5 time zone) in the program time zone.</li>
  <li>Writes <code>point_task_trading_deal_log</code> (one row per deal, with its release time) and accumulates into <code>point_task_trading_log</code> (one row per client / task / day).</li>
</ol>

<h3>Engine 2 — coin release (job <code>autoReleaseJob</code>)</h3>
<ol class="conds">
  <li>Takes deals waiting for release whose release time has come, grouped by client / task / day.</li>
  <li>Applies the daily cap in deal order: full release, partial release (cap reached), or no release (over the cap, status <code>-2</code>).</li>
  <li>Coins into the wallet: one lot per day (<code>point_lot</code>) accumulated across releases; each release writes one <code>earn</code> row in the coin ledger (<code>point_ledger</code>). Validity follows <code>point_expiration_window</code>.</li>
  <li>On error it retries; after 3 failures → <code>-1</code> / <code>ISSUE_FAILED</code>.</li>
  <li>The two engines share one lock; engine 2 waits at most 15 seconds for it.</li>
</ol>

<h3>When coins are credited</h3>
<table>
  <tr><th style="width:22%">Mode</th><th>Release time of a deal</th></tr>
  <tr><td><code>in-day</code></td><td>As soon as it is calculated; coins arrive on the next run of engine 2.</td></tr>
  <tr><td><code>delayed</code> (N days)</td><td>00:00 (program time zone) of the trading day + N days: a day's coins arrive in one batch.</td></tr>
</table>

<h3>Schedule</h3>
<table>
  <tr><th style="width:34%">Job</th><th>Schedule</th></tr>
  <tr><td><code>tradeLogSyncJob</code></td><td>Every 3 minutes</td></tr>
  <tr><td><code>autoReleaseJob</code></td><td>Every 10 minutes → coins arrive within about 15 minutes after closing (the front-end says "within 15 minutes")</td></tr>
  <tr><td><code>mt5TimezoneTaskJob</code></td><td>Refreshes the MT5 time zone (must be registered in the scheduler)</td></tr>
</table>
<p>Any schedule change must be announced, because the app wording depends on it. <code>fetch_num</code> = 500.</p>

  <tr><td><code>INVALID_CURRENT_TIME</code></td><td><code>currentTime</code> 不是有效的秒级时间戳。</td></tr>

</ul>
<div class="specsrc" id="spec-api-get" data-title="tradingTask/get" hidden><p class="specmeta">POST <code>/pointSys/app/point/tradingTask/get</code> · Token</p><p>任务信息、今日汇总及客户账户（Earn 页、交易卡片）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>clientId</code></td><td>long</td><td>当前登录客户，必须与 token 一致。</td></tr><tr><td><code>currentTime</code></td><td>long，秒</td><td>仅测试用：模拟当前时间（秒级时间戳）。不传则用服务器时间。非法值 → <code>INVALID_CURRENT_TIME</code>。</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>tradingTask</code></td><td>bool</td><td><code>false</code> = 客户没有可参加的任务（只返回该字段）。</td></tr><tr><td><code>program.ended</code></td><td>bool</td><td>任务有限定参与时间，且已过结束时间。</td></tr><tr><td><code>program.creditMode</code></td><td>string</td><td><code>in-day</code>（当日发放）或 <code>delayed</code>（N 天后发放）。</td></tr><tr><td><code>program.minHoldSeconds</code></td><td>int</td><td>最短持仓时间，秒。</td></tr><tr><td><code>program.minHoldMinutes</code></td><td>int</td><td>同上，换算为分钟，向下取整。</td></tr><tr><td><code>program.creditDelayDays</code></td><td>int</td><td><code>delayed</code> 模式下的延迟天数；<code>in-day</code> 模式下为 0。</td></tr><tr><td><code>program.expiryDays</code></td><td>int</td><td>积分有效天数。</td></tr><tr><td><code>program.dailyMaxPoints</code></td><td>long | null</td><td>每位客户每日积分上限。<code>null</code> = 不设上限。</td></tr><tr><td><code>program.tzMinutes</code></td><td>int</td><td>任务时区，用于划分日期。</td></tr><tr><td><code>program.termsUrl</code></td><td>string | null</td><td>条款 PDF 链接，原样返回。<code>null</code> 或空字符串 = 无。</td></tr><tr><td><code>program.rateRange</code></td><td>{min, max} | null</td><td>任务所有费率行中每手积分的最低值和最高值。</td></tr><tr><td><code>today.periodKey</code></td><td>yyyy-MM-dd</td><td>按任务时区的今天。</td></tr><tr><td><code>today.lots</code></td><td>decimal</td><td>今日已计算交易的总手数。</td></tr><tr><td><code>today.lotsValid</code></td><td>decimal</td><td>积分已发放到钱包的交易手数。</td></tr><tr><td><code>today.points</code></td><td>long</td><td>今日已发放到钱包的积分。</td></tr><tr><td><code>today.capped</code></td><td>bool</td><td>已达每日上限。</td></tr><tr><td><code>today.status</code></td><td>string</td><td><code>not_started</code> / <code>pending</code> / <code>earning</code> / <code>credited</code>（见规则）。</td></tr><tr><td><code>today.creditAt</code></td><td>ISO UTC | null</td><td>预计发放时间，仅在 <code>pending</code> 时返回。</td></tr><tr><td><code>today.updatedAt</code></td><td>ISO UTC | null</td><td>最近更新时间。</td></tr><tr><td><code>selectedAccountId</code></td><td>long</td><td>默认选中账户 = <code>accounts</code> 的第一个元素。<code>accounts</code> 为空时不返回。</td></tr><tr><td><code>accounts[].id</code></td><td>long</td><td>真实交易账号。</td></tr><tr><td><code>accounts[].eligible</code></td><td>bool</td><td>该账户的 MT5 组在任务中配置了费率。</td></tr><tr><td><code>accounts[].rates[]</code></td><td>{type, value, ptsPerLot}</td><td>该账户的费率表。<code>type</code> = <code>symbol</code> / <code>symbol_group</code> / <code>any</code>。</td></tr><tr class="rvnew"><td><code>accounts[].group</code> <span class="pending">NEW</span></td><td>string</td><td>该账户的 MT5 组，原样返回完整组名（如 <code>Direct\VIP1</code>）。所有账户都返回。</td></tr><tr class="rvnew"><td><code>accounts[].lifetimeDeposit</code> <span class="pending">NEW</span></td><td>decimal, USD</td><td>该账户已批准入金总额。从未入金 = 0。</td></tr><tr class="rvnew"><td><code>tiers[]</code> <span class="pending">NEW</span></td><td>{group, rates[]}</td><td>任务中配置了费率的每个 MT5 组一项；<code>rates</code> 与 <code>accounts[].rates</code> 结构相同。</td></tr></table></div><p class="specmeta">完整响应（含外层结构）。前端严格按此结构映射：每个字段的名称、位置、类型保持一致；值为 <code>null</code> 的字段也照常返回。</p><pre>{

  "result": {

    "tiers": [

      { "group": "Direct\\VIP1",    "rates": [ "...5 rows, ptsPerLot 90.0..." ] },

}</pre><p class="specmeta">没有任务时：</p><pre>{ "success": true, "code": 200, "message": "", "result": { "tradingTask": false }, "extraData": null, "timestamp": 1791970217315 }</pre></div><div class="specsec"><h4>3. 规则</h4><ul class="rules"><li>任务选择：客户组（<code>group_code</code>）→ <code>promo_client_group</code> → 积分计划 → 任务包 → 交易任务；4 级均启用；按 Book Type、展示前置事件（<code>display_event</code>）、展示时间窗、全局隐藏标志、黑名单过滤。多个任务同时符合 → 取 id 最小的。</li><li>已过参与结束时间的任务仍会返回，并带 <code>ended = true</code>。</li><li><code>today.status</code>：发放时间尚未到 → <code>pending</code>；仍有待发积分且未达上限 → <code>earning</code>；否则 → <code>credited</code>；当日无数据 → <code>not_started</code>。</li><li><code>accounts</code>：客户未删除的真实账户；MT5 组每次调用时从 <code>mt5_users</code> 读取（不使用 <code>bo_client_logins</code> 中的组字段）。排序：<code>eligible</code> 在前，其次按账号升序。</li><li><code>rates</code>：只保留 <code>ptsPerLot</code> &gt; 0 的行；<code>symbol</code> / <code>symbol_group</code> 行在前，按费率降序；<code>any</code> 行放最后。</li></ul></div></div><div class="specsrc" id="spec-api-guest" data-title="guest/tradingTask/get" hidden><p class="specmeta">POST <code>/pointSys/app/point/guest/tradingTask/get</code> · 无需 token</p><p>未登录游客版本：任务规则，不含个人数据。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr class="rvnew"><td><code>currentTime</code> <span class="pending">NEW</span></td><td>long，秒</td><td>仅测试用，与其他接口相同。</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr class="rvnew"><td><code>*</code> <span class="pending">NEW</span></td><td></td><td>结构与 <code>tradingTask/get</code> 相同。<code>today</code> 固定为 <code>not_started</code>，各数值为 0；<code>accounts = []</code>；不返回 <code>selectedAccountId</code>，不返回 <code>tiers</code>。</td></tr></table></div><p class="specmeta">完整响应（含外层结构）。前端严格按此结构映射：每个字段的名称、位置、类型保持一致；值为 <code>null</code> 的字段也照常返回。</p><pre>{

  "result": {

    "program": {

    },

      "lotsValid": 0,
      "points": 0,
      "status": "not_started",

    },

}</pre><p class="specmeta">没有任务时：</p><pre>{ "success": true, "code": 200, "message": "", "result": { "tradingTask": false }, "extraData": null, "timestamp": 1791970217315 }</pre></div><div class="specsec"><h4>3. 规则</h4><ul class="rules"><li>不校验 token，不需要 <code>clientId</code>；请求中带 <code>clientId</code> 也忽略。仍校验 <code>x-auth-key</code>。</li><li>复用 <code>tradingTask/get</code> 的任务选择方法，参数固定：客户组 <code>direct_client</code>（写死在代码中）、book type 9、KYC / 首次入金 / 首次交易时间 = 0、<code>clientId</code> = null。无需修改 SQL。</li><li>效果：只展示 <code>display_event = signup</code> 的任务；对所有人隐藏的任务不展示；黑名单不生效。</li></ul><p class="specmeta">等价 SQL：</p><pre>-- Equivalent SQL of guest/tradingTask/get (read only). No row =&gt; {"tradingTask": false}
SET @now = UTC_TIMESTAMP();

SELECT d.*,                                   -- program fields are built from this row
       r.min_ppl AS rate_range_min,
       r.max_ppl AS rate_range_max
FROM promo_client_group a
JOIN point_program b      ON b.id = a.promo_config_id
JOIN point_task_bundle c  ON c.program_id = b.id
JOIN point_task_trading d ON d.task_bundle_id = c.id
LEFT JOIN (
    SELECT task_id, MIN(point_per_lot) AS min_ppl, MAX(point_per_lot) AS max_ppl
    FROM point_task_trading_point_conversion
    WHERE deleted = 0 AND point_per_lot &gt; 0
    GROUP BY task_id
) r ON r.task_id = d.id
WHERE a.client_group = 'direct_client'        -- hard-coded client group
  AND a.promo_table  = 'point_program'
  AND a.enabled = 1 AND b.enabled = 1 AND c.enabled = 1 AND d.enabled = 1
  AND b.display_hide_book_type &lt;&gt; 9           -- guest book type = 9 (unknown)
  AND c.display_hide_book_type &lt;&gt; 9
  AND d.display_hide_book_type &lt;&gt; 9
  AND d.display_event = 'signup'              -- kyc / ftd / first trade time = 0
  AND (d.display_period_limit_apply = 0
       OR (@now &gt;= d.display_period_from AND @now &lt; d.display_period_to))
  AND d.display_hide_to_all = 0               -- clientId = null: no own trading log
                                              -- blacklist: not applied (clientId = null)
ORDER BY d.id
LIMIT 1;</pre></div></div><div class="specsrc" id="spec-api-history" data-title="tradingTask/getHistory" hidden><p class="specmeta">POST <code>/pointSys/app/point/tradingTask/getHistory</code> · Token</p><p>按日的交易积分历史（Earn 页 History 标签）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>clientId</code></td><td>long</td><td>当前登录客户，必须与 token 一致。</td></tr><tr><td><code>currentTime</code></td><td>long，秒</td><td>仅测试用：模拟当前时间（秒级时间戳）。不传则用服务器时间。非法值 → <code>INVALID_CURRENT_TIME</code>。</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>开始日期。不传 = 今天 − 6 天。</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>结束日期。不传 = 今天；晚于今天则截为今天。</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>tradingTask</code></td><td>bool</td><td><code>false</code> = 没有任务，或客户在黑名单中。</td></tr><tr><td><code>range</code></td><td>{from, to, tzMinutes}</td><td>实际使用的日期范围。</td></tr><tr><td><code>days[].date</code></td><td>yyyy-MM-dd</td><td>日期（任务时区）。只返回有数据的日期，最新在前。</td></tr><tr><td><code>days[].lots</code></td><td>decimal</td><td>= 当日的 <code>lotsValid</code>。</td></tr><tr><td><code>days[].points</code></td><td>long</td><td>已发放到钱包的积分。</td></tr><tr><td><code>days[].status</code></td><td>string</td><td>同 <code>today.status</code>。</td></tr><tr><td><code>days[].capped</code></td><td>bool</td><td>当日已达上限。</td></tr></table></div></div><div class="specsec"><h4>3. 规则</h4><ul class="rules"><li>范围超过 30 天 → <code>RANGE_TOO_LONG</code>；<code>from</code> 晚于 <code>to</code> 或格式错误 → <code>INVALID_RANGE</code>。</li></ul></div></div><div class="specsrc" id="spec-api-summary" data-title="coin/summary" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/summary</code> · Token</p><p>积分余额（Coins 页顶部）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>clientId</code></td><td>long</td><td>当前登录客户，必须与 token 一致。</td></tr><tr><td><code>currentTime</code></td><td>long，秒</td><td>仅测试用：模拟当前时间（秒级时间戳）。不传则用服务器时间。非法值 → <code>INVALID_CURRENT_TIME</code>。</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>available</code></td><td>long</td><td>未过期批次的余额合计。</td></tr><tr><td><code>expiring</code></td><td>long</td><td>未来 10 天内将过期的余额。</td></tr><tr><td><code>pending</code></td><td>long</td><td>待发放的交易积分。前端不使用。</td></tr></table></div></div><div class="specsec"><h4>3. 规则</h4><ul class="rules"><li>基于客户所有来源（交易、签到、人工调整）的积分批次计算，与任务无关。</li></ul></div></div><div class="specsrc" id="spec-api-available" data-title="coin/listAvailable" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/listAvailable</code> · Token</p><p>未过期的积分批次（Coins 页 Available 标签）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>clientId</code></td><td>long</td><td>当前登录客户，必须与 token 一致。</td></tr><tr><td><code>currentTime</code></td><td>long，秒</td><td>仅测试用：模拟当前时间（秒级时间戳）。不传则用服务器时间。非法值 → <code>INVALID_CURRENT_TIME</code>。</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>页码，默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>每页条数，默认 15。</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>展示时区（相对 UTC 的分钟偏移），默认 420（GMT+7）。前端传 <code>program.tzMinutes</code>。</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>items[].source</code></td><td>string</td><td><code>trading</code> / <code>daily_checkin</code> / <code>adjust</code>.</td></tr><tr><td><code>items[].earnedOn</code></td><td>yyyy-MM-dd</td><td>积分发放到钱包的日期。</td></tr><tr><td><code>items[].total</code></td><td>long</td><td>批次初始积分。</td></tr><tr><td><code>items[].remaining</code></td><td>long</td><td>剩余积分。</td></tr><tr><td><code>items[].status</code></td><td>string</td><td><code>active</code>（有余额）/ <code>used</code>（已用完）。</td></tr><tr><td><code>items[].creditAt</code></td><td>ISO UTC</td><td>积分发放到钱包的时间。</td></tr><tr><td><code>items[].expiresAt</code></td><td>ISO UTC</td><td>过期时间。</td></tr><tr><td><code>items[].expiringSoon</code></td><td>bool</td><td>有余额且未来 10 天内过期。</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>分页；<code>total</code> = 批次总数。</td></tr></table></div></div><div class="specsec"><h4>3. 规则</h4><ul class="rules"><li>排序：有余额的批次在前，最早过期的排最前；已用完的批次放最后。</li></ul></div></div><div class="specsrc" id="spec-api-expired" data-title="coin/listExpired" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/listExpired</code> · Token</p><p>已过期的积分批次（Coins 页 Expired 标签）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>clientId</code></td><td>long</td><td>当前登录客户，必须与 token 一致。</td></tr><tr><td><code>currentTime</code></td><td>long，秒</td><td>仅测试用：模拟当前时间（秒级时间戳）。不传则用服务器时间。非法值 → <code>INVALID_CURRENT_TIME</code>。</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>开始日期。不传 = 今天 − 6 天。</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>结束日期。不传 = 今天；晚于今天则截为今天。</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>页码，默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>每页条数，默认 15。</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>展示时区（相对 UTC 的分钟偏移），默认 420（GMT+7）。前端传 <code>program.tzMinutes</code>。</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>range</code></td><td>{from, to, tzMinutes}</td><td>实际使用的日期范围（按过期日期筛选）。</td></tr><tr><td><code>items[].source</code></td><td>string</td><td>同 <code>listAvailable</code>。</td></tr><tr><td><code>items[].earnedOn</code></td><td>yyyy-MM-dd</td><td>积分发放到钱包的日期。</td></tr><tr><td><code>items[].total</code></td><td>long</td><td>初始积分。</td></tr><tr><td><code>items[].expired</code></td><td>long</td><td>因过期损失的积分；过期前已用完则为 0。</td></tr><tr><td><code>items[].expiredAt</code></td><td>ISO UTC</td><td>过期时间。</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>分页。</td></tr></table></div></div><div class="specsec"><h4>3. 规则</h4><ul class="rules"><li>排序：最近过期的在前。日期范围限制同 <code>getHistory</code>。</li></ul></div></div><div class="specsrc" id="spec-api-ledger" data-title="coin/ledger" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/ledger</code> · Token</p><p>积分变动流水（Coins 页 History 标签）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>clientId</code></td><td>long</td><td>当前登录客户，必须与 token 一致。</td></tr><tr><td><code>currentTime</code></td><td>long，秒</td><td>仅测试用：模拟当前时间（秒级时间戳）。不传则用服务器时间。非法值 → <code>INVALID_CURRENT_TIME</code>。</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>开始日期。不传 = 今天 − 6 天。</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>结束日期。不传 = 今天；晚于今天则截为今天。</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>页码，默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>每页条数，默认 15。</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>展示时区（相对 UTC 的分钟偏移），默认 420（GMT+7）。前端传 <code>program.tzMinutes</code>。</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">字段</th><th style="width:16%">类型</th><th>含义</th></tr><tr><td><code>items[].happenedAt</code></td><td>ISO UTC</td><td>发生时间。</td></tr><tr><td><code>items[].date</code></td><td>yyyy-MM-dd</td><td>按 <code>tzMinutes</code> 计算的发生日期。</td></tr><tr><td><code>items[].type</code></td><td>string</td><td><code>earn</code> / <code>consume</code> / <code>refund</code> / <code>expire</code> / <code>adjust_positive</code> / <code>adjust_negative</code>.</td></tr><tr><td><code>items[].source</code></td><td>string</td><td><code>trading</code> / <code>daily_checkin</code> / <code>adjust</code> / <code>redeem</code>.</td></tr><tr><td><code>items[].points</code></td><td>long</td><td>带符号：增加为正，扣减为负。</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>分页。</td></tr></table></div></div><div class="specsec"><h4>3. 规则</h4><ul class="rules"><li><code>expire</code> 行不在积分流水表中：由已过期且仍有余额的批次生成（<code>points</code> = − 余额）。过期前已用完的批次不生成 <code>expire</code> 行。</li><li>排序：最新在前。每次发放一行，不合并。</li></ul></div></div>
</section><section class="panel" id="engine" role="tabpanel">
<h2>4. Engine</h2>
<h3>引擎 1 — 积分计算（任务 <code>tradeLogSyncJob</code>）</h3>
<ol class="conds">
  <li>按 deal id 游标从 MT5 读取新的平仓交易（<code>t_cursor_notify_progress</code>，类型 <code>point_trade_point_log</code>；每次最多 <code>fetch_num</code> 笔）。只取平仓（<code>Entry = 1</code>）、买 / 卖（<code>Action</code> 0、1），排除 demo / 管理类 MT5 组。没有任何任务时游标仍推进到最新 deal（历史交易不补算）。</li>
  <li>由账户找到客户（<code>bo_client_logins</code>，真实账户），再由客户的 <code>group_code</code> 找到进行中的任务；跳过黑名单客户。</li>
  <li>持仓时间短于 <code>min_position_hold_second</code> 的交易不计。</li>
  <li>按账户的 MT5 组查找费率，优先级：<code>symbol</code>（精确品种）&gt; <code>symbol_group</code> &gt; <code>any</code>（值为 <code>other</code>）。<code>symbol_group</code> 由 <code>mt5_symbols</code> 中品种的路径推导：<code>forex</code>、<code>metal</code>、<code>energy</code>、<code>index</code>、<code>stocks</code>，其余为 <code>other</code>。</li>
  <li>每笔积分 = 手数 × 费率，向下取整。交易日期 = 平仓时间（按 MT5 时区换算为 UTC）再转为任务时区的日期。</li>
  <li>写入 <code>point_task_trading_deal_log</code>（每笔一行，含发放时间），并累加到 <code>point_task_trading_log</code>（每个客户 / 任务 / 日一行）。</li>
</ol>

<h3>引擎 2 — 积分发放（任务 <code>autoReleaseJob</code>）</h3>
<ol class="conds">
  <li>取出已到发放时间的待发放交易，按客户 / 任务 / 日分组。</li>
  <li>按交易顺序应用每日上限：全额发放、部分发放（触及上限）或不发放（超出上限，状态 <code>-2</code>）。</li>
  <li>积分入账：每日一个批次（<code>point_lot</code>），多次发放累加；每次发放在积分流水（<code>point_ledger</code>）中写一条 <code>earn</code>。有效期按 <code>point_expiration_window</code>。</li>
  <li>出错会重试；失败超过 3 次 → <code>-1</code> / <code>ISSUE_FAILED</code>。</li>
  <li>两个引擎共用一把锁；引擎 2 最多等待 15 秒。</li>
</ol>

<h3>积分到账时间</h3>
<table>
  <tr><th style="width:22%">模式</th><th>交易的发放时间</th></tr>
  <tr><td><code>in-day</code></td><td>计算后即可发放；积分在引擎 2 下一次运行时到账。</td></tr>
  <tr><td><code>delayed</code>（N 天）</td><td>交易日 + N 天的 00:00（任务时区）：一天的积分一次性到账。</td></tr>
</table>

<h3>调度</h3>
<table>
  <tr><th style="width:34%">Job</th><th>调度</th></tr>
  <tr><td><code>tradeLogSyncJob</code></td><td>每 3 分钟一次</td></tr>
  <tr><td><code>autoReleaseJob</code></td><td>每 10 分钟一次 → 平仓后约 15 分钟内到账（前端文案为 "within 15 minutes"）</td></tr>
  <tr><td><code>mt5TimezoneTaskJob</code></td><td>刷新 MT5 时区（必须在调度中配置）</td></tr>
</table>
<p>调度变更必须通知，因为 App 文案依赖于此。<code>fetch_num</code> = 500。</p>
</section><section class="panel" id="config" role="tabpanel">

<table>

<h3>每手积分</h3>
<p>每个 MT5 组有 5 行相同费率：<code>symbol_group</code> metal、forex、energy、index，以及一行 <code>any</code> = <code>other</code>（覆盖股票及其他所有品种）。</p>
<table>
  <tr><th style="width:34%">MT5 组</th><th>Coin / lot</th></tr>

</table>
<p>其他组（包括 <code>1F\Direct\Mini10</code> 这类变体）有意不计积分。</p>

  <tr><td><code>Direct\MIVIP</code></td><td>Platinum</td><td>5.000</td></tr>
</table>

<h3>配置注意事项</h3>
<ul>
  <li><code>display_hide_book_type</code> 必须有值（如 0）；为空则任务对所有人都不展示。</li>
  <li>真实 MT5 组来自 <code>mt5_users</code>；<code>bo_client_logins</code> 中的组字段可能已过时。</li>
</ul>
</section><section class="panel" id="log" role="tabpanel">

<section class="panel" id="overview" role="tabpanel">
<h2>1. Tổng quan</h2>
<p>Module Trading Task của HSB Loyalty: khách giao dịch tài khoản thật, mỗi lot đóng được quy ra coin theo tỷ lệ cấu hình; coin vào ví và dùng để đổi quà. Trang này là spec chung giữa sản phẩm, backend và front-end, phản ánh hành vi code hiện tại (đã nghiệm thu trên UAT). Cập nhật: 2026-10-19.</p>

<h3>Cách đọc trang</h3>
<ul>
  <li>Dòng / khối <span class="rvnew">nền tím</span> = yêu cầu của đợt đang mở (2026-10-19), backend chưa làm. Chi tiết ở tab <a href="#req" class="ref">Yêu cầu đang mở</a>.</li>
  <li>Mọi thay đổi về sau được ghi thẳng vào trang này và vào tab <a href="#log" class="ref">Nhật ký</a>; không gửi file rời.</li>
  <li>Giờ trong DB và trong response là UTC; ngày được chia theo múi giờ chương trình (<code>tz_minutes</code>).</li>
</ul>

<h3>Thành phần</h3>
<table>

</table>

</section><section class="panel" id="req" role="tabpanel">
<h2>2. Yêu cầu đang mở — 2026-10-19</h2>
<p>Hai hạng mục. Làm xong và đưa lên UAT thì báo đường dẫn của G-1; bên QA test nhỏ cả hai rồi cập nhật trang này.</p>

<h3>G-1. API mới <code>guest/tradingTask/get</code> <span class="pending">OPEN</span></h3>
<p>Khách chưa đăng nhập (không có <code>clientId</code>, không có token) vẫn xem được luật chơi trên trang Earn. Bên sản phẩm chấp nhận: mọi khách chưa đăng nhập đều được hiện theo cấu hình của nhóm khách <code>direct_client</code>.</p>
<ul>
  <li>Đường dẫn đề xuất <code>/pointSys/app/point/guest/tradingTask/get</code> (backend có thể đổi, báo lại).</li>
  <li>Không kiểm token, không cần <code>clientId</code>; có gửi cũng bỏ qua. Vẫn kiểm <code>x-auth-key</code>; mở quyền truy cập không cần đăng nhập trong <code>t_uri_access_rule</code>. Hỗ trợ <code>currentTime</code> như các API khác.</li>
  <li>Trong code, gọi lại hàm <code>PointTaskTradingMapper.getAppTradingTaskConfig</code> (giống <code>AppPointTradeTaskServiceImpl</code> dòng 124). Đây là <b>tham số truyền vào hàm</b>, không phải tham số request: request của API này không có tham số nào, trừ <code>currentTime</code> để test. Bản đăng nhập đọc các giá trị này từ <code>crm_customer_base</code> theo <code>clientId</code>; khách vãng lai không có <code>clientId</code> nên bỏ bước đọc đó và truyền giá trị cố định: <div class="scroll"><table>
      <tr><th style="width:22%">Tham số của hàm</th><th>Bản đăng nhập (hiện tại)</th><th style="width:30%">Bản khách vãng lai</th></tr>
      <tr><td><code>groupCode</code></td><td><code>crm_customer_base.group_code</code></td><td><code>direct_client</code>, viết cứng trong code</td></tr>
      <tr><td><code>promoTable</code></td><td><code>PromoTableEnum.POINT_PROGRAM.getTableName()</code></td><td>Giữ nguyên</td></tr>
      <tr><td><code>bookType</code></td><td><code>crm_customer_base.client_book_type</code>; trống thì <code>UNKNOWN_BOOK_TYPE</code> (9)</td><td><code>UNKNOWN_BOOK_TYPE</code> (9)</td></tr>
      <tr><td><code>kycTime</code></td><td><code>crm_customer_base.kyc_approve_time</code></td><td><code>0</code></td></tr>
      <tr><td><code>ftdTime</code></td><td><code>crm_customer_base.first_deposit_time</code></td><td><code>0</code></td></tr>
      <tr><td><code>firstTradeTime</code></td><td><code>crm_customer_base.first_real_trade_time</code></td><td><code>0</code></td></tr>
      <tr><td><code>clientId</code></td><td>Lấy từ request: <code>clientId</code></td><td><code>null</code></td></tr>
      <tr><td><code>now</code></td><td>Giờ hệ thống, hoặc <code>currentTime</code> nếu request có gửi</td><td>Giữ nguyên</td></tr>
    </table></div> Với <code>clientId = null</code>, SQL hiện có tự cho đúng hành vi cần: chương trình bật cờ ẩn với mọi người không hiện, blacklist không áp dụng. Không cần sửa SQL. SQL tương đương ở spec của API.</li>
  <li>Response cùng cấu trúc <code>tradingTask/get</code>: <code>program</code> dựng bằng <code>buildProgram</code> hiện có; <code>today</code> = kết quả <code>buildToday(null, …)</code> (<code>not_started</code>, mọi số bằng 0); <code>accounts = []</code>; không có <code>selectedAccountId</code>, không có <code>tiers</code>.</li>
  <li>Chỉ làm API này. Năm API còn lại là dữ liệu cá nhân, khách chưa đăng nhập không cần.</li>
</ul>
<p><button type="button" class="specbtn" data-spec="api-guest">Spec guest/tradingTask/get</button></p>

<h3>G-2. Bổ sung 3 trường vào API đã có <code>tradingTask/get</code> <span class="pending">OPEN</span></h3>
<p><code>tradingTask/get</code> là API <b>đang chạy</b>. Yêu cầu này <b>chỉ thêm 3 trường</b> cho tính năng hạng tài khoản trên trang Earn (khách đã đăng nhập). Tên hạng và ngưỡng nạp do front-end giữ; backend chỉ trả dữ liệu dưới đây.</p>

<h4>Giữ nguyên</h4>
<ul>
  <li>Đường dẫn, request, xác thực: không đổi.</li>
  <li><b>Mọi trường đang trả giữ nguyên</b> tên, kiểu và ý nghĩa: <code>tradingTask</code>, toàn bộ <code>program</code>, toàn bộ <code>today</code>, <code>selectedAccountId</code>, <code>accounts[].id</code>, <code>accounts[].eligible</code>, <code>accounts[].rates</code>. Không bỏ, không đổi tên trường nào.</li>
  <li>Logic hiện có giữ nguyên: chọn chương trình, tính <code>today</code>, danh sách và thứ tự <code>accounts</code>, cách lọc và xếp <code>rates</code>.</li>
</ul>

<h4>Thêm mới</h4>
<div class="scroll"><table>
  <tr><th style="width:22%">Trường mới</th><th style="width:16%">Vị trí</th><th style="width:12%">Kiểu</th><th>Cách lấy</th></tr>
  <tr><td><code>group</code></td><td>Trong mỗi phần tử <code>accounts[]</code></td><td>string</td>
      <td>Nhóm MT5 mà <code>buildAccounts</code> đã đọc từ <code>mt5_users</code> để tính <code>rates</code> (không truy vấn thêm). Trả <b>nguyên tên đầy đủ</b>, ví dụ <code>Direct\VIP1</code>, <code>1F\Direct\Mini10</code>; không cắt. Có ở mọi tài khoản, kể cả <code>eligible = false</code>. Không tìm thấy nhóm → <code>null</code>.</td></tr>
  <tr><td><code>lifetimeDeposit</code></td><td>Trong mỗi phần tử <code>accounts[]</code></td><td>decimal, USD</td>
      <td>Tổng tiền nạp đã duyệt của tài khoản. Chạy một lần cho mỗi khách theo câu SQL dưới, rồi gán theo <code>login_id</code>. Tài khoản không có dòng nào → <code>0</code>.</td></tr>
  <tr><td><code>tiers</code></td><td>Cấp ngoài cùng của <code>result</code>, ngang hàng <code>accounts</code></td><td>array of <code>{ group, rates }</code></td>
      <td>Lấy các dòng tỷ lệ của task hiện tại trong <code>point_task_trading_point_conversion</code> (<code>deleted = 0</code>), gom theo <code>mt5_group</code>; mỗi nhóm một phần tử. <code>group</code> = <code>mt5_group</code> nguyên tên; <code>rates</code> sinh bằng <b>cùng hàm</b> <code>buildRates</code> với <code>accounts[].rates</code>, để hai chỗ luôn khớp. Nhóm có <code>rates</code> rỗng thì bỏ. Không cần sắp xếp. Không trả khi <code>tradingTask = false</code>.</td></tr>
</table></div>
<p class="specmeta">Câu SQL lấy <code>lifetimeDeposit</code>:</p>
<pre>SELECT login_id, SUM(amount_converted) AS deposit_usd   -- amount_converted is always USD
FROM bo_client_deposit_proposal
WHERE proposal_status = 2                                      -- approved
  AND client_id = #{clientId}
GROUP BY login_id</pre>
<p class="specmeta">Response sau khi thêm (chỉ trích phần liên quan):</p>
<pre>{
  "tradingTask": true,
  "program": { ...unchanged... },
  "today":   { ...unchanged... },
  "selectedAccountId": 31000001,
  "accounts": [
    { "id": 31000001, "eligible": true, "rates": [ ...unchanged... ],
      "group": "Direct\\Mini400",          // NEW
      "lifetimeDeposit": 150.0 },            // NEW
    { "id": 31000002, "eligible": false, "rates": [],
      "group": "1F\\Direct\\Mini10",       // NEW
      "lifetimeDeposit": 0 }                 // NEW
  ],
  "tiers": [                                 // NEW
    { "group": "Direct\\Mini400", "rates": [ { "type": "symbol_group", "value": "metal", "ptsPerLot": 70 }, "..." ] },
    { "group": "Direct\\Mini10",  "rates": [ "..." ] },
    { "group": "Direct\\VIP1",    "rates": [ "..." ] },
    { "group": "Direct\\MIVIP",   "rates": [ "..." ] }
  ]
}</pre>
<p><button type="button" class="specbtn" data-spec="api-get">Spec tradingTask/get</button></p>

<h3>Lưu ý chung</h3>

  <li>Trường giá trị <code>null</code> có thể được trả tường minh hoặc vắng mặt; front-end xử lý như nhau.</li>
  <li>Số thập phân có thể được trả dạng <code>70.0</code>.</li>
</ul>
<div class="specsrc" id="spec-api-get" data-title="tradingTask/get" hidden><p class="specmeta">POST <code>/pointSys/app/point/tradingTask/get</code> · Token</p><p>Thông tin chương trình, tổng hợp hôm nay và tài khoản của khách (trang Earn, thẻ trading).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Khách đang đăng nhập. Phải khớp với token.</td></tr><tr><td><code>currentTime</code></td><td>long, giây</td><td>Chỉ để test: giả lập giờ hiện tại (epoch giây). Không gửi thì dùng giờ máy chủ. Giá trị không hợp lệ → <code>INVALID_CURRENT_TIME</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>tradingTask</code></td><td>bool</td><td><code>false</code> = khách không có chương trình (chỉ có trường này).</td></tr><tr><td><code>program.ended</code></td><td>bool</td><td>Chương trình có giới hạn thời gian tham gia và đã qua giờ kết thúc.</td></tr><tr><td><code>program.creditMode</code></td><td>string</td><td><code>in-day</code> (coin về trong ngày) hoặc <code>delayed</code> (coin về sau N ngày).</td></tr><tr><td><code>program.minHoldSeconds</code></td><td>int</td><td>Thời gian giữ lệnh tối thiểu, giây.</td></tr><tr><td><code>program.minHoldMinutes</code></td><td>int</td><td>Như trên, đổi ra phút, làm tròn xuống.</td></tr><tr><td><code>program.creditDelayDays</code></td><td>int</td><td>Số ngày chờ ở chế độ <code>delayed</code>; 0 ở chế độ <code>in-day</code>.</td></tr><tr><td><code>program.expiryDays</code></td><td>int</td><td>Số ngày coin còn hạn dùng.</td></tr><tr><td><code>program.dailyMaxPoints</code></td><td>long | null</td><td>Trần coin mỗi khách mỗi ngày. <code>null</code> = không có trần.</td></tr><tr><td><code>program.tzMinutes</code></td><td>int</td><td>Múi giờ của chương trình, dùng để chia ngày.</td></tr><tr><td><code>program.termsUrl</code></td><td>string | null</td><td>Link PDF điều khoản, trả nguyên văn. <code>null</code> hoặc chuỗi rỗng = không có.</td></tr><tr><td><code>program.rateRange</code></td><td>{min, max} | null</td><td>Tỷ lệ coin mỗi lot thấp nhất và cao nhất trên mọi dòng tỷ lệ của chương trình.</td></tr><tr><td><code>today.periodKey</code></td><td>yyyy-MM-dd</td><td>Hôm nay theo múi giờ chương trình.</td></tr><tr><td><code>today.lots</code></td><td>decimal</td><td>Tổng lot các lệnh đã được tính trong ngày.</td></tr><tr><td><code>today.lotsValid</code></td><td>decimal</td><td>Lot của các lệnh mà coin đã về ví.</td></tr><tr><td><code>today.points</code></td><td>long</td><td>Coin đã về ví trong ngày.</td></tr><tr><td><code>today.capped</code></td><td>bool</td><td>Đã chạm trần ngày.</td></tr><tr><td><code>today.status</code></td><td>string</td><td><code>not_started</code> / <code>pending</code> / <code>earning</code> / <code>credited</code> (xem quy tắc).</td></tr><tr><td><code>today.creditAt</code></td><td>ISO UTC | null</td><td>Giờ coin dự kiến về, chỉ có khi <code>pending</code>.</td></tr><tr><td><code>today.updatedAt</code></td><td>ISO UTC | null</td><td>Lần cập nhật gần nhất.</td></tr><tr><td><code>selectedAccountId</code></td><td>long</td><td>Tài khoản chọn sẵn = phần tử đầu của <code>accounts</code>. Không có khi <code>accounts</code> rỗng.</td></tr><tr><td><code>accounts[].id</code></td><td>long</td><td>Số tài khoản giao dịch thật.</td></tr><tr><td><code>accounts[].eligible</code></td><td>bool</td><td>Nhóm MT5 của tài khoản có dòng tỷ lệ trong chương trình.</td></tr><tr><td><code>accounts[].rates[]</code></td><td>{type, value, ptsPerLot}</td><td>Bảng tỷ lệ của tài khoản. <code>type</code> = <code>symbol</code> / <code>symbol_group</code> / <code>any</code>.</td></tr><tr class="rvnew"><td><code>accounts[].group</code> <span class="pending">NEW</span></td><td>string</td><td>Nhóm MT5 của tài khoản, nguyên tên đầy đủ (ví dụ <code>Direct\VIP1</code>). Có ở mọi tài khoản.</td></tr><tr class="rvnew"><td><code>accounts[].lifetimeDeposit</code> <span class="pending">NEW</span></td><td>decimal, USD</td><td>Tổng tiền nạp đã duyệt của tài khoản. Chưa từng nạp = 0.</td></tr><tr class="rvnew"><td><code>tiers[]</code> <span class="pending">NEW</span></td><td>{group, rates[]}</td><td>Mỗi nhóm MT5 có dòng tỷ lệ trong chương trình là một phần tử; <code>rates</code> cùng dạng <code>accounts[].rates</code>.</td></tr></table></div><p class="specmeta">Response đầy đủ, gồm cả vỏ ngoài. Front-end map đúng theo dạng này: giữ nguyên tên, vị trí và kiểu của từng trường; trường có giá trị <code>null</code> vẫn được trả.</p><pre>{

v class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr class="rvnew"><td><code>*</code> <span class="pending">NEW</span></td><td></td><td>Cùng cấu trúc <code>tradingTask/get</code>. <code>today</code> cố định <code>not_started</code>, mọi số bằng 0; <code>accounts = []</code>; không có <code>selectedAccountId</code>, không có <code>tiers</code>.</td></tr></table></div><p class="specmeta">Response đầy đủ, gồm cả vỏ ngoài. Front-end map đúng theo dạng này: giữ nguyên tên, vị trí và kiểu của từng trường; trường có giá trị <code>null</code> vẫn được trả.</p><pre>{

    },

}</pre><p class="specmeta">Khi không có chương trình:</p><pre>{ "success": true, "code": 200, "message": "", "result": { "tradingTask": false }, "extraData": null, "timestamp": 1791970217315 }</pre></div><div class="specsec"><h4>3. Quy tắc</h4><ul class="rules"><li>Không kiểm token, không cần <code>clientId</code>; request có gửi <code>clientId</code> cũng bỏ qua. Vẫn kiểm <code>x-auth-key</code>.</li><li>Gọi lại đúng hàm chọn chương trình của <code>tradingTask/get</code> với tham số cố định: nhóm khách <code>direct_client</code> (viết cứng trong code), book type 9, các mốc KYC / nạp lần đầu / giao dịch lần đầu = 0, <code>clientId</code> = null. Không cần sửa SQL.</li><li>Hệ quả: chỉ chương trình <code>display_event = signup</code> được hiện; chương trình bật cờ ẩn với mọi người không hiện; blacklist không áp dụng.</li></ul><p class="specmeta">SQL tương đương:</p><pre>-- Equivalent SQL of guest/tradingTask/get (read only). No row =&gt; {"tradingTask": false}
SET @now = UTC_TIMESTAMP();

SELECT d.*,                                   -- program fields are built from this row
       r.min_ppl AS rate_range_min,
       r.max_ppl AS rate_range_max
FROM promo_client_group a
JOIN point_program b      ON b.id = a.promo_config_id
JOIN point_task_bundle c  ON c.program_id = b.id
JOIN point_task_trading d ON d.task_bundle_id = c.id
LEFT JOIN (
    SELECT task_id, MIN(point_per_lot) AS min_ppl, MAX(point_per_lot) AS max_ppl
    FROM point_task_trading_point_conversion
    WHERE deleted = 0 AND point_per_lot &gt; 0
    GROUP BY task_id
) r ON r.task_id = d.id
WHERE a.client_group = 'direct_client'        -- hard-coded client group
  AND a.promo_table  = 'point_program'
  AND a.enabled = 1 AND b.enabled = 1 AND c.enabled = 1 AND d.enabled = 1
  AND b.display_hide_book_type &lt;&gt; 9           -- guest book type = 9 (unknown)
  AND c.display_hide_book_type &lt;&gt; 9
  AND d.display_hide_book_type &lt;&gt; 9
  AND d.display_event = 'signup'              -- kyc / ftd / first trade time = 0
  AND (d.display_period_limit_apply = 0
       OR (@now &gt;= d.display_period_from AND @now &lt; d.display_period_to))
  AND d.display_hide_to_all = 0               -- clientId = null: no own trading log
                                              -- blacklist: not applied (clientId = null)
ORDER BY d.id
LIMIT 1;</pre></div></div><div class="specsrc" id="spec-api-history" data-title="tradingTask/getHistory" hidden><p class="specmeta">POST <code>/pointSys/app/point/tradingTask/getHistory</code> · Token</p><p>Lịch sử coin trading theo ngày (tab History của trang Earn).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Khách đang đăng nhập. Phải khớp với token.</td></tr><tr><td><code>currentTime</code></td><td>long, giây</td><td>Chỉ để test: giả lập giờ hiện tại (epoch giây). Không gửi thì dùng giờ máy chủ. Giá trị không hợp lệ → <code>INVALID_CURRENT_TIME</code>.</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>Ngày bắt đầu. Không gửi = hôm nay − 6 ngày.</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>Ngày kết thúc. Không gửi = hôm nay; quá hôm nay thì bị cắt về hôm nay.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>tradingTask</code></td><td>bool</td><td><code>false</code> = không có chương trình, hoặc khách bị blacklist.</td></tr><tr><td><code>range</code></td><td>{from, to, tzMinutes}</td><td>Khoảng ngày đã áp dụng.</td></tr><tr><td><code>days[].date</code></td><td>yyyy-MM-dd</td><td>Ngày (múi giờ chương trình). Chỉ có ngày có dữ liệu, mới nhất trước.</td></tr><tr><td><code>days[].lots</code></td><td>decimal</td><td>= <code>lotsValid</code> của ngày.</td></tr><tr><td><code>days[].points</code></td><td>long</td><td>Coin đã về ví.</td></tr><tr><td><code>days[].status</code></td><td>string</td><td>Như <code>today.status</code>.</td></tr><tr><td><code>days[].capped</code></td><td>bool</td><td>Ngày đó đã chạm trần.</td></tr></table></div></div><div class="specsec"><h4>3. Quy tắc</h4><ul class="rules"><li>Khoảng dài hơn 30 ngày → <code>RANGE_TOO_LONG</code>; <code>from</code> sau <code>to</code> hoặc sai định dạng → <code>INVALID_RANGE</code>.</li></ul></div></div><div class="specsrc" id="spec-api-summary" data-title="coin/summary" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/summary</code> · Token</p><p>Số dư coin (đầu trang Coins).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Khách đang đăng nhập. Phải khớp với token.</td></tr><tr><td><code>currentTime</code></td><td>long, giây</td><td>Chỉ để test: giả lập giờ hiện tại (epoch giây). Không gửi thì dùng giờ máy chủ. Giá trị không hợp lệ → <code>INVALID_CURRENT_TIME</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>available</code></td><td>long</td><td>Tổng số dư các lô còn hạn.</td></tr><tr><td><code>expiring</code></td><td>long</td><td>Phần số dư sẽ hết hạn trong 10 ngày tới.</td></tr><tr><td><code>pending</code></td><td>long</td><td>Coin trading đang chờ phát. Front-end không dùng.</td></tr></table></div></div><div class="specsec"><h4>3. Quy tắc</h4><ul class="rules"><li>Tính trên mọi lô coin của khách, mọi nguồn (trading, check-in, điều chỉnh tay), không phụ thuộc chương trình.</li></ul></div></div><div class="specsrc" id="spec-api-available" data-title="coin/listAvailable" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/listAvailable</code> · Token</p><p>Các lô coin còn hạn (tab Available của trang Coins).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Khách đang đăng nhập. Phải khớp với token.</td></tr><tr><td><code>currentTime</code></td><td>long, giây</td><td>Chỉ để test: giả lập giờ hiện tại (epoch giây). Không gửi thì dùng giờ máy chủ. Giá trị không hợp lệ → <code>INVALID_CURRENT_TIME</code>.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Trang, mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Số dòng mỗi trang, mặc định 15.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Múi giờ hiển thị (phút lệch so với UTC), mặc định 420 (GMT+7). Front-end gửi <code>program.tzMinutes</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>items[].source</code></td><td>string</td><td><code>trading</code> / <code>daily_checkin</code> / <code>adjust</code>.</td></tr><tr><td><code>items[].earnedOn</code></td><td>yyyy-MM-dd</td><td>Ngày coin về ví.</td></tr><tr><td><code>items[].total</code></td><td>long</td><td>Số coin ban đầu của lô.</td></tr><tr><td><code>items[].remaining</code></td><td>long</td><td>Số coin còn lại.</td></tr><tr><td><code>items[].status</code></td><td>string</td><td><code>active</code> (còn coin) / <code>used</code> (đã dùng hết).</td></tr><tr><td><code>items[].creditAt</code></td><td>ISO UTC</td><td>Giờ coin về ví.</td></tr><tr><td><code>items[].expiresAt</code></td><td>ISO UTC</td><td>Giờ hết hạn.</td></tr><tr><td><code>items[].expiringSoon</code></td><td>bool</td><td>Còn coin và hết hạn trong 10 ngày tới.</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>Phân trang; <code>total</code> = tổng số lô.</td></tr></table></div></div><div class="specsec"><h4>3. Quy tắc</h4><ul class="rules"><li>Thứ tự: lô còn coin trước, hạn gần nhất lên đầu; lô đã dùng hết nằm cuối.</li></ul></div></div><div class="specsrc" id="spec-api-expired" data-title="coin/listExpired" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/listExpired</code> · Token</p><p>Các lô coin đã hết hạn (tab Expired của trang Coins).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Khách đang đăng nhập. Phải khớp với token.</td></tr><tr><td><code>currentTime</code></td><td>long, giây</td><td>Chỉ để test: giả lập giờ hiện tại (epoch giây). Không gửi thì dùng giờ máy chủ. Giá trị không hợp lệ → <code>INVALID_CURRENT_TIME</code>.</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>Ngày bắt đầu. Không gửi = hôm nay − 6 ngày.</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>Ngày kết thúc. Không gửi = hôm nay; quá hôm nay thì bị cắt về hôm nay.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Trang, mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Số dòng mỗi trang, mặc định 15.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Múi giờ hiển thị (phút lệch so với UTC), mặc định 420 (GMT+7). Front-end gửi <code>program.tzMinutes</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>range</code></td><td>{from, to, tzMinutes}</td><td>Khoảng ngày đã áp dụng (lọc theo ngày hết hạn).</td></tr><tr><td><code>items[].source</code></td><td>string</td><td>Như <code>listAvailable</code>.</td></tr><tr><td><code>items[].earnedOn</code></td><td>yyyy-MM-dd</td><td>Ngày coin về ví.</td></tr><tr><td><code>items[].total</code></td><td>long</td><td>Số coin ban đầu.</td></tr><tr><td><code>items[].expired</code></td><td>long</td><td>Số coin mất do hết hạn; 0 nếu đã dùng hết trước hạn.</td></tr><tr><td><code>items[].expiredAt</code></td><td>ISO UTC</td><td>Giờ hết hạn.</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>Phân trang.</td></tr></table></div></div><div class="specsec"><h4>3. Quy tắc</h4><ul class="rules"><li>Thứ tự: hết hạn gần đây nhất lên đầu. Giới hạn khoảng ngày như <code>getHistory</code>.</li></ul></div></div><div class="specsrc" id="spec-api-ledger" data-title="coin/ledger" hidden><p class="specmeta">POST <code>/pointSys/app/point/coin/ledger</code> · Token</p><p>Lịch sử biến động coin (tab History của trang Coins).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>clientId</code></td><td>long</td><td>Khách đang đăng nhập. Phải khớp với token.</td></tr><tr><td><code>currentTime</code></td><td>long, giây</td><td>Chỉ để test: giả lập giờ hiện tại (epoch giây). Không gửi thì dùng giờ máy chủ. Giá trị không hợp lệ → <code>INVALID_CURRENT_TIME</code>.</td></tr><tr><td><code>from</code></td><td>yyyy-MM-dd</td><td>Ngày bắt đầu. Không gửi = hôm nay − 6 ngày.</td></tr><tr><td><code>to</code></td><td>yyyy-MM-dd</td><td>Ngày kết thúc. Không gửi = hôm nay; quá hôm nay thì bị cắt về hôm nay.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Trang, mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Số dòng mỗi trang, mặc định 15.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Múi giờ hiển thị (phút lệch so với UTC), mặc định 420 (GMT+7). Front-end gửi <code>program.tzMinutes</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Response</h4><div class="scroll"><table><tr><th style="width:30%">Trường</th><th style="width:16%">Kiểu</th><th>Ý nghĩa</th></tr><tr><td><code>items[].happenedAt</code></td><td>ISO UTC</td><td>Thời điểm phát sinh.</td></tr><tr><td><code>items[].date</code></td><td>yyyy-MM-dd</td><td>Ngày phát sinh theo <code>tzMinutes</code>.</td></tr><tr><td><code>items[].type</code></td><td>string</td><td><code>earn</code> / <code>consume</code> / <code>refund</code> / <code>expire</code> / <code>adjust_positive</code> / <code>adjust_negative</code>.</td></tr><tr><td><code>items[].source</code></td><td>string</td><td><code>trading</code> / <code>daily_checkin</code> / <code>adjust</code> / <code>redeem</code>.</td></tr><tr><td><code>items[].points</code></td><td>long</td><td>Có dấu: cộng dương, trừ âm.</td></tr><tr><td><code>pageNo, pageSize, total</code></td><td>int</td><td>Phân trang.</td></tr></table></div></div><div class="specsec"><h4>3. Quy tắc</h4><ul class="rules"><li>Dòng <code>expire</code> không có trong sổ coin: được sinh từ lô đã hết hạn mà còn số dư (<code>points</code> = − số dư). Lô đã dùng hết trước hạn không sinh dòng <code>expire</code>.</li><li>Thứ tự: mới nhất trước. Mỗi lần coin về là một dòng, không gộp.</li></ul></div></div>
</section><section class="panel" id="engine" role="tabpanel">
<h2>4. Engine</h2>
<h3>Engine 1 — tính coin (job <code>tradeLogSyncJob</code>)</h3>
<ol class="conds">
  <li>Đọc lệnh đóng mới từ MT5 theo con trỏ deal id (<code>t_cursor_notify_progress</code>, loại <code>point_trade_point_log</code>; mỗi lần tối đa <code>fetch_num</code> lệnh). Chỉ lấy lệnh đóng (<code>Entry = 1</code>), mua / bán (<code>Action</code> 0, 1), bỏ nhóm MT5 demo / quản trị. Khi chưa có chương trình nào, con trỏ vẫn chạy tới deal mới nhất (không tính bù lệnh cũ).</li>
  <li>Từ tài khoản tìm khách (<code>bo_client_logins</code>, tài khoản thật), từ <code>group_code</code> của khách tìm các task đang mở; bỏ khách bị blacklist.</li>
  <li>Bỏ lệnh giữ ngắn hơn <code>min_position_hold_second</code>.</li>
  <li>Tìm tỷ lệ theo nhóm MT5 của tài khoản, ưu tiên: <code>symbol</code> (đúng mã) &gt; <code>symbol_group</code> &gt; <code>any</code> (giá trị <code>other</code>). <code>symbol_group</code> suy từ đường dẫn của mã trong <code>mt5_symbols</code>: <code>forex</code>, <code>metal</code>, <code>energy</code>, <code>index</code>, <code>stocks</code>, còn lại <code>other</code>.</li>
  <li>Coin của lệnh = lot × tỷ lệ, làm tròn xuống. Ngày của lệnh = giờ đóng lệnh (quy về UTC theo múi giờ MT5) đổi sang múi giờ chương trình.</li>
  <li>Ghi <code>point_task_trading_deal_log</code> (mỗi lệnh một dòng, kèm giờ hẹn phát) và cộng dồn vào <code>point_task_trading_log</code> (mỗi khách / task / ngày một dòng).</li>
</ol>

<h3>Engine 2 — phát coin (job <code>autoReleaseJob</code>)</h3>
<ol class="conds">
  <li>Lấy các lệnh chờ phát đã tới giờ hẹn, gom theo khách / task / ngày.</li>
  <li>Áp trần ngày theo thứ tự lệnh: phát đủ, phát một phần (chạm trần), hoặc không phát (vượt trần, trạng thái <code>-2</code>).</li>
  <li>Coin vào ví: mỗi ngày một lô (<code>point_lot</code>) cộng dồn qua các lần phát; mỗi lần phát một dòng <code>earn</code> trong sổ coin (<code>point_ledger</code>). Hạn dùng theo <code>point_expiration_window</code>.</li>
  <li>Lỗi thì thử lại; quá 3 lần → <code>-1</code> / <code>ISSUE_FAILED</code>.</li>
  <li>Hai engine dùng chung một khoá; engine 2 chờ khoá tối đa 15 giây.</li>
</ol>

<h3>Giờ coin về</h3>
<table>
  <tr><th style="width:22%">Chế độ</th><th>Giờ hẹn phát của lệnh</th></tr>
  <tr><td><code>in-day</code></td><td>Ngay khi được tính; coin về ở lần chạy kế tiếp của engine 2.</td></tr>
  <tr><td><code>delayed</code> (N ngày)</td><td>00:00 (múi giờ chương trình) của ngày giao dịch + N ngày: coin của một ngày về một lượt.</td></tr>
</table>

<h3>Lịch chạy</h3>
<table>
  <tr><th style="width:34%">Job</th><th>Lịch</th></tr>
  <tr><td><code>tradeLogSyncJob</code></td><td>3 phút một lần</td></tr>
  <tr><td><code>autoReleaseJob</code></td><td>10 phút một lần → coin về trong vòng khoảng 15 phút sau khi đóng lệnh (front-end ghi "within 15 minutes")</td></tr>
  <tr><td><code>mt5TimezoneTaskJob</code></td><td>Cập nhật múi giờ MT5 (phải được khai trong lịch chạy)</td></tr>
</table>
<p>Đổi lịch chạy thì phải báo, vì câu chữ trên app phụ thuộc vào lịch này. <code>fetch_num</code> = 500.</p>

<h2>6. Nhật ký</h2>

<div id="specmodal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-top"><span id="spec-title"></span><button type="button" id="spec-close" aria-label="Đóng">✕</button></div>
    <div id="spec-body" class="modal-body"></div>
  </div>
</div>

</template>

<script>var TITLES = {"en": "HSB Loyalty – Trading Task & Coin Spec", "zh": "HSB Loyalty – 交易任务与积分规格", "vi": "HSB Loyalty – Trading Task & Coin Spec"};
(function () {
  var app = document.getElementById('app'), sel = document.getElementById('lang');
  var FIRST = 'overview', current = FIRST;
  function show(id, push) {
    app.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById(b.dataset.tab).classList.toggle('on', on);
    });
    current = id;
    if (push) history.replaceState(null, '', '#' + id);
  }
  function go(hash) {
    var el = hash && hash.length > 1 && document.getElementById(hash.slice(1));
    if (!el) return false;
    var panel = el.classList.contains('panel') ? el : el.closest('.panel');
    if (!panel) return false;
    show(panel.id, false);
    if (el !== panel) el.scrollIntoView(); else window.scrollTo(0, 0);
    return true;
  }
  function mount(lang, keepTab) {
    var tpl = document.getElementById('tpl-' + lang) || document.getElementById('tpl-en');
    app.innerHTML = tpl.innerHTML;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.title = TITLES[lang] || TITLES.en;
    sel.value = lang;
    if (keepTab) show(current, false);
    else if (!go(location.hash)) show(FIRST, false);
  }
  function closeModal() { var m = document.getElementById('specmodal'); if (m) m.hidden = true; }
  document.addEventListener('click', function (ev) {
    var sb = ev.target.closest('.specbtn');
    if (sb) {
      var src = document.getElementById('spec-' + sb.dataset.spec);
      if (src) {
        document.getElementById('spec-title').textContent = src.dataset.title || '';
        document.getElementById('spec-body').innerHTML = src.innerHTML;
        document.getElementById('specmodal').hidden = false;
      }
      return;
    }
    if (ev.target.closest('#spec-close')) { closeModal(); return; }
    var tab = ev.target.closest('.tabs button');
    if (tab) { show(tab.dataset.tab, true); window.scrollTo(0, 0); return; }
    var a = ev.target.closest('a.ref');
    if (a && go(a.getAttribute('href'))) { ev.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); closeModal(); }
  });
  sel.addEventListener('change', function () {
    mount(sel.value, true);
  });
  mount('en', false);  // always default to English on load; dropdown still switches within the session
})();
</script>
